<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>โมเดล 3D</title>

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
        }

        h1 {
            margin: 20px;
        }

        model-viewer {
            width: 100%;
            height: 70vh;
            background: white;
        }
    </style>
</head>

<body>

    <h1>❤️ หัวใจมนุษย์</h1>

    <model-viewer
        src="heart.glb"
        camera-controls
        auto-rotate
        shadow-intensity="1">
    </model-viewer>

    <p>ใช้นิ้วหมุนและซูมโมเดลได้</p>

</body>
</html>
